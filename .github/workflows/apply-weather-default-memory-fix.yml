name: Apply weather default memory fix

on:
  push:
    branches:
      - fix/weather-default-memory

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/weather-default-memory

      - name: Apply weather memory patch
        run: python scripts/apply-weather-default-memory-fix.py

      - name: Check focused weather fix
        run: |
          node --check server.mjs
          node --test tests/weather-default-memory.test.mjs

      - name: Commit clean source change
        run: |
          rm .github/workflows/apply-weather-default-memory-fix.yml
          rm scripts/apply-weather-default-memory-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs tests/weather-default-memory.test.mjs .github/workflows/apply-weather-default-memory-fix.yml scripts/apply-weather-default-memory-fix.py
          git commit -m "Use owner memory for weather default place"
          git push origin HEAD:fix/weather-default-memory
