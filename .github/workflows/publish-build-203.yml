name: Publish Pam's Holo Build 203

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-build-203.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Build 203 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34062252718 \
            --repo "${{ github.repository }}" \
            --name "Pams-Holo-Android-update" \
            --dir artifact

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find artifact -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" "Pams-Holo-Update-Build-203-WhatsApp-Kontakte.apk"
          sha256sum "Pams-Holo-Update-Build-203-WhatsApp-Kontakte.apk"

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-203-whatsapp-kontakte"
          asset="Pams-Holo-Update-Build-203-WhatsApp-Kontakte.apk"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$asset" \
              --repo "${{ github.repository }}" \
              --target "76600c81e329fe81d02fb1c5aa5a20069a601aaa" \
              --title "Pam's Holo – WhatsApp & Kontakte Build 203" \
              --notes "Originalsigniertes Android-Update aus dem erfolgreichen main-Build #203. Sol Holo kann nach deiner Freigabe alle lokal auf dem Handy gespeicherten Kontakte mit Telefonnummer durchsuchen, eindeutige private Kontakt-Aliasse wie Schatz merken und einen WhatsApp-Entwurf mit sichtbarem Empfänger und vollständigem Text vorbereiten. Sol Holo verschickt keine Nachricht selbst: WhatsApp wird geöffnet und du bestätigst den Versand dort. Installation als Update; vorhandene App nicht deinstallieren."
          fi
