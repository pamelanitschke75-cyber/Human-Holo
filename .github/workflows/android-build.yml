      - name: Marktstart- und Pam-Holo-Schutzgrenze prüfen
        run: |
          set -Eeuo pipefail
          grep -q 'const PROVISIONED_BACKEND_URL = ""' \
            www/human-holo-backend-config.js
          grep -q 'marketReleaseApproved: false' \
            modules/human-holo-launch-policy.mjs
          legacy_signing_secret_prefix="SOL_HOLO_KEYSTORE"
          ! grep -q "${legacy_signing_secret_prefix}_BASE64" \
            .github/workflows/android-build.yml
          echo "Nur Buildprüfung: keine Signierung, kein Upload und keine Marktfreigabe."
