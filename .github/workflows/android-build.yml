name: Human Holo · Legal-Review-Buildprüfung

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "assets/**"
      - "www/**"
      - "android-native/**"
      - "scripts/**"
      - "modules/**"
      - "tests/**"
      - "licenses/**"
      - "server.mjs"
      - "video-upload-security.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "assets/logo.png"
      - "www/icon-192.png"
      - "www/icon-512.png"
      - "www/manifest.json"
      - "www/index.html"
      - "www/app-lock-bootstrap.mjs"
      - "www/legal-consent-bootstrap.mjs"
      - "www/human-holo-test-access.js"
      - "www/human-holo-launch-policy.js"
      - "www/human-holo-test-export-core.mjs"
      - "www/human-holo-test-export.mjs"
      - "www/human-holo-local-owner-data.mjs"
      - "www/data-rights.mjs"
      - "www/memory-control.mjs"
      - "www/trusted-app-session.mjs"
      - "www/headaudio.min.mjs"
      - "www/headworklet.min.mjs"
      - "www/full-face-rig.mjs"
      - "www/consent-signature.mjs"
      - "www/consent-ui-bootstrap.mjs"
      - "www/model-en-mixed.b64"
      - "www/media-tools.js"
      - "www/sol-holo-logo.png"
      - "www/human-holo-logo.png"
      - "www/human-holo-ai-policy.js"
      - "www/sol-motion-profile.js"
      - "www/remote-audio-level.js"
      - "www/sol-holo-ui.css"
      - "www/sol-holo-wow.css"
      - "www/sol-holo-chat-115.css"
      - "www/sol-holo-backup-core.mjs"
      - "www/human-holo-animal-core.mjs"
      - "www/human-holo-animal-holos.mjs"
      - "www/assets/**"
      - "www/human-holo-chatgpt-memory-bridge.mjs"
      - "www/human-holo-durable-memory.mjs"
      - "www/sol-holo-backup.css"
      - "www/sol-holo-backup.mjs"
      - "www/human-holo-theme.css"
      - "www/sol-holo-ui.js"
      - "www/service-worker.js"
      - "www/third-party/**"
      - "server.mjs"
      - "video-upload-security.mjs"
      - "modules/**"
      - "licenses/**"
      - "package.json"
      - "package-lock.json"
      - "android-native/**"
      - "tests/*.test.mjs"
      - "tests/java/**"
      - "scripts/check-samsung-notes-language.mjs"
      - "scripts/generate-third-party-licenses.mjs"
      - "scripts/audit-android-runtime-licenses.mjs"
      - "scripts/install-full-face-rig-assets.mjs"
      - "scripts/install-access-security.mjs"
      - "scripts/install-speaker-identity.mjs"
      - "scripts/install-whatsapp-driving-mode.mjs"

jobs:
  build-android:
    # HUMAN-HOLO-HOLD: Eine eigene Application-ID und Signaturlinie sind noch
    # nicht von Pamela Nitschke festgelegt. Bis dahin darf dieser historische
    # Android-Prüfpfad weder unter Pams com.solholo.app bauen noch ein Paket
    # erzeugen. Der getrennte Web-Test wird im Node-Prüfworkflow validiert.
    if: ${{ false }}
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Android API 36 bereitstellen
        run: |
          set -Eeuo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$android_sdk_root"
          sdk_manager="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdk_manager"
          "$sdk_manager" "platforms;android-36"

      - name: Mehrfaktor-Sicherheitslogik testen
        run: |
          set -Eeuo pipefail
          if command -v javac >/dev/null 2>&1; then
            test_dir="$RUNNER_TEMP/security-factor-policy-test"
            mkdir -p "$test_dir"
            javac -d "$test_dir" \
              android-native/SecurityFactorPolicy.java \
              tests/java/com/solholo/app/SecurityFactorPolicyTest.java
            java -cp "$test_dir" com.solholo.app.SecurityFactorPolicyTest
          else
            echo "Kein JDK-Compiler vorhanden; reiner Java-Policy-Test wird übersprungen."
          fi

      - name: Node-Abhängigkeiten installieren
        run: npm install

      - name: Stille Modultests ausführen
        run: node --test tests/*.test.mjs

      - name: NPM-Sicherheitsbericht ausgeben
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-all.json || true
          npm audit --omit=dev --json > npm-audit-runtime.json || true
          node - <<'NODE'
          const fs = require('fs');

          function printReport(label, file) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const counts = report.metadata?.vulnerabilities || {};
            console.log(`\n===== ${label} =====`);
            console.log(
              `low=${counts.low || 0}, moderate=${counts.moderate || 0}, ` +
              `high=${counts.high || 0}, critical=${counts.critical || 0}, ` +
              `total=${counts.total || 0}`
            );

            const vulnerabilities = Object.values(report.vulnerabilities || {})
              .sort((a, b) => String(a.name).localeCompare(String(b.name)));

            for (const vulnerability of vulnerabilities) {
              console.log(
                `\n${vulnerability.name} | severity=${vulnerability.severity} | ` +
                `direct=${Boolean(vulnerability.isDirect)} | range=${vulnerability.range || ''}`
              );

              for (const cause of vulnerability.via || []) {
                if (typeof cause === 'string') {
                  console.log(`  via package: ${cause}`);
                  continue;
                }
                console.log(
                  `  advisory: ${cause.title || ''} | ` +
                  `severity=${cause.severity || ''} | range=${cause.range || ''}`
                );
                if (cause.url) console.log(`  ${cause.url}`);
              }

              if (vulnerability.effects?.length) {
                console.log(`  effects: ${vulnerability.effects.join(', ')}`);
              }
              console.log(`  fixAvailable: ${JSON.stringify(vulnerability.fixAvailable)}`);
            }
          }

          printReport('ALLE NPM-ABHÄNGIGKEITEN', 'npm-audit-all.json');
          printReport('NUR RUNTIME / OHNE DEV-ABHÄNGIGKEITEN', 'npm-audit-runtime.json');
          NODE

      - name: Erzeugte Drittanbieter-Lizenzdateien prüfen
        run: |
          set -Eeuo pipefail
          test -s THIRD_PARTY_LICENSES.txt
          test -s NPM_LICENSE_INVENTORY.txt
          test -s www/THIRD_PARTY_LICENSES.txt
          test -s www/NPM_LICENSE_INVENTORY.txt
          test -s www/third-party/HeadAudio-LICENSE.txt
          test -s www/third-party/APACHE-2.0.txt
          test -s www/mediapipe/MODIFICATION_NOTICE.txt
          grep -q "SOL HOLO MODIFICATION NOTICE" www/mediapipe/vision_bundle.mjs
          grep -q "@mediapipe/tasks-vision" www/THIRD_PARTY_LICENSES.txt
          grep -q "@capacitor/android" www/THIRD_PARTY_LICENSES.txt
          grep -q "HeadAudio browser lip-sync components" www/THIRD_PARTY_LICENSES.txt
          grep -q "@trapezedev/project" www/NPM_LICENSE_INVENTORY.txt
          grep -q "url-template" www/NPM_LICENSE_INVENTORY.txt

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Google-Play-Ziel-API 36 setzen
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          variables_file = Path("android/variables.gradle")
          variables = variables_file.read_text(encoding="utf-8")

          if not re.search(r"(?m)^\s*minSdkVersion\s*=\s*23\s*$", variables):
              raise SystemExit("Android-minSdkVersion 23 muss unverändert bleiben.")

          for name in ("compileSdkVersion", "targetSdkVersion"):
              variables, replacements = re.subn(
                  rf"(?m)^(\s*){name}\s*=\s*35\s*$",
                  rf"\1{name} = 36",
                  variables,
                  count=1,
              )
              if replacements != 1:
                  raise SystemExit(f"{name} konnte nicht eindeutig auf API 36 gesetzt werden.")

          variables_file.write_text(variables, encoding="utf-8")

          build_file = Path("android/build.gradle")
          build_text = build_file.read_text(encoding="utf-8")
          build_text, replacements = re.subn(
              r"com\.android\.tools\.build:gradle:8\.7\.2",
              "com.android.tools.build:gradle:8.10.1",
              build_text,
              count=1,
          )
          if replacements != 1:
              raise SystemExit("Android Gradle Plugin konnte nicht eindeutig auf 8.10.1 gesetzt werden.")
          build_file.write_text(build_text, encoding="utf-8")

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties").read_text(
              encoding="utf-8"
          )
          if "gradle-8.11.1-all.zip" not in wrapper:
              raise SystemExit("Für AGP 8.10.1 wird der vorhandene Gradle-8.11.1-Wrapper benötigt.")

          print("Human Holo: minSdk 23 bleibt; compileSdk und targetSdk sind API 36.")
          PY

      - name: Fortlaufende Build-Version setzen
        env:
          SOL_HOLO_VERSION_CODE: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          build_file = Path("android/app/build.gradle")
          text = build_file.read_text(encoding="utf-8")
          version_code = os.environ["SOL_HOLO_VERSION_CODE"]

          updated, replacements = re.subn(
              r"(?m)^(\s*)versionCode\s+\d+\s*$",
              rf"\1versionCode {version_code}",
              text,
              count=1,
          )

          if replacements != 1:
              raise SystemExit("Android-versionCode konnte nicht eindeutig gesetzt werden.")

          build_file.write_text(updated, encoding="utf-8")
          print(f"Human-Holo-versionCode: {version_code}")
          PY

      - name: Human-Holo-App-Symbol erzeugen
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#020714" \
            --iconBackgroundColorDark "#020714" \
            --splashBackgroundColor "#020714" \
            --splashBackgroundColorDark "#020714"

      - name: Human Holo App nach Android synchronisieren
        run: npx cap sync android

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Drittanbieter-Lizenzen in Android-Assets prüfen
        run: |
          set -Eeuo pipefail
          test -s android/app/src/main/assets/public/THIRD_PARTY_LICENSES.txt
          test -s android/app/src/main/assets/public/NPM_LICENSE_INVENTORY.txt
          test -s android/app/src/main/assets/public/third-party/HeadAudio-LICENSE.txt
          test -s android/app/src/main/assets/public/third-party/APACHE-2.0.txt
          test -s android/app/src/main/assets/public/mediapipe/MODIFICATION_NOTICE.txt
          grep -q "SOL HOLO MODIFICATION NOTICE" \
            android/app/src/main/assets/public/mediapipe/vision_bundle.mjs

      - name: Android-Laufzeitabhängigkeiten und Lizenzen prüfen
        run: |
          set -Eeuo pipefail
          (
            cd android
            ./gradlew app:dependencies --configuration releaseRuntimeClasspath
          ) > android-runtime-dependencies.txt
          node scripts/audit-android-runtime-licenses.mjs \
            android-runtime-dependencies.txt \
            android/app/src/main/assets/public
          test -s ANDROID_RUNTIME_LICENSES.txt
          test -s android/app/src/main/assets/public/ANDROID_RUNTIME_LICENSES.txt
          test -s android/app/src/main/assets/public/ANDROID_RUNTIME_DEPENDENCIES.txt

      - name: Android Legal-Review-Profil einbinden
        run: |
          set -Eeuo pipefail
          node scripts/install-whatsapp-driving-mode.mjs
          manifest="android/app/src/main/AndroidManifest.xml"
          activity="android/app/src/main/java/com/solholo/app/MainActivity.java"
          phone="android/app/src/main/java/com/solholo/app/PhoneContactsPlugin.java"
          policy="android/app/src/main/assets/public/human-holo-launch-policy.js"
          memory_control="android/app/src/main/assets/public/memory-control.mjs"
          data_rights="android/app/src/main/assets/public/data-rights.mjs"
          test_access="android/app/src/main/assets/public/human-holo-test-access.js"
          test_export="android/app/src/main/assets/public/human-holo-test-export.mjs"
          local_owner_data="android/app/src/main/assets/public/human-holo-local-owner-data.mjs"
          app_html="android/app/src/main/assets/public/index.html"

          for forbidden in \
            'android.permission.CALL_PHONE' \
            'android.permission.READ_PHONE_STATE' \
            'android.permission.SYSTEM_ALERT_WINDOW' \
            'android.permission.POST_NOTIFICATIONS' \
            'android.permission.READ_CALENDAR' \
            'android.permission.WRITE_CALENDAR' \
            'com.android.alarm.permission.SET_ALARM' \
            'android.permission.FOREGROUND_SERVICE_MICROPHONE' \
            'android.permission.WAKE_LOCK' \
            'android.permission.health.' \
            'BIND_ACCESSIBILITY_SERVICE' \
            'BIND_NOTIFICATION_LISTENER_SERVICE' \
            'HeyHoSolService' \
            'HealthPrivacyActivity'; do
            ! grep -q "$forbidden" "$manifest"
          done

          ! grep -q 'HealthConnectPlugin' "$activity"
          ! grep -q 'HeyHoSolPlugin' "$activity"
          ! grep -q 'SolSpeakerIdentityPlugin' "$activity"
          ! grep -q 'GalaxyWatchBridgePlugin' "$activity"
          ! test -e android/app/src/main/java/com/solholo/app/WhatsAppAutoSendAccessibilityService.java
          ! test -e android/app/src/main/java/com/solholo/app/WhatsAppNotificationListener.java
          ! test -e android/app/src/main/java/com/solholo/app/HealthConnectPlugin.java
          ! test -e android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          ! test -e android/app/src/main/java/com/solholo/app/GalaxyWatchBridgePlugin.java
          grep -q 'Intent.ACTION_DIAL' "$phone"
          grep -q 'result.put("automaticSendRequested", false)' "$phone"
          grep -q 'automaticFullTranscriptStorage: false' "$policy"
          grep -q 'medicalAdvice: false' "$policy"
          grep -q 'personalCloneCall: false' "$policy"
          grep -q 'liveCamera: false' "$policy"
          grep -q 'backgroundWake: false' "$policy"
          grep -q 'speakerBiometrics: false' "$policy"
          grep -q 'originalFullSync: false' "$policy"
          grep -q 'calendarRemindersNotes: false' "$policy"
          grep -q 'googlePersonalServices: false' "$policy"
          grep -q 'smartThings: false' "$policy"
          grep -q 'alarmAndWatch: false' "$policy"
          grep -q 'personalAppearance: false' "$policy"
          grep -q 'animalHolos: false' "$policy"
          grep -q 'memoryRestore: false' "$policy"
          ! grep -q 'Intent.ACTION_CALL' "$phone"
          ! grep -q 'public void startContactCall' "$phone"
          ! grep -q 'public void startHelpServiceCall' "$phone"
          grep -q '/memory/control/preferences' "$memory_control"
          grep -q '/memory/control/delete' "$memory_control"
          grep -q '/data-rights/erasure/execute' "$data_rights"
          grep -q 'eraseHumanHoloOwnerLocalData' "$data_rights"
          grep -q 'sessionStorage.setItem' "$test_access"
          ! grep -q 'localStorage' "$test_access"
          grep -q 'encryptHumanHoloTestData' "$test_export"
          grep -q 'cursor.delete()' "$local_owner_data"
          ! grep -q 'deleteDatabase' "$local_owner_data"
          ! grep -q 'sol-holo-backup.mjs' "$app_html"
          ! grep -q 'consent-ui-bootstrap.mjs' "$app_html"
          ! grep -q 'src="./original-full-sync.js' "$app_html"
          ! grep -q 'src="./sol-motion-profile.js' "$app_html"

      - name: Geparkte Kalender- und Geräteaktionen prüfen
        run: |
          set -Eeuo pipefail
          app_manifest="android/app/src/main/AndroidManifest.xml"
          calendar_java="android/app/src/main/java/com/solholo/app/PhoneContactsPlugin.java"
          app_ui="android/app/src/main/assets/public/sol-holo-ui.js"
          ! grep -q 'android.permission.READ_CALENDAR' "$app_manifest"
          ! grep -q 'android.permission.WRITE_CALENDAR' "$app_manifest"
          ! grep -q 'com.android.alarm.permission.SET_ALARM' "$app_manifest"
          grep -q 'public void saveCalendarEvent' "$calendar_java"
          grep -q 'public void listCalendarEvents' "$calendar_java"
          grep -q 'window.saveSolHoloCalendarDraft' "$app_ui"
          grep -q 'id="calendarList"' "$app_ui"
          grep -q 'calendarRemindersNotes' "$app_ui"
          grep -q 'Kalenderaktionen sind im Human-Holo-Legal-Review-Test geparkt' "$app_ui"

      - name: Mehrfaktor-Zugriffssicherheit einbinden
        run: node scripts/install-access-security.mjs

      - name: Getrennten Testexport und geparkte Pam-Module prüfen
        run: |
          set -Eeuo pipefail
          app_java="android/app/src/main/java/com/solholo/app/MainActivity.java"
          backup_java="android/app/src/main/java/com/solholo/app/SolBackupPlugin.java"
          backup_rules="android/app/src/main/res/xml/sol_holo_backup_rules.xml"
          extraction_rules="android/app/src/main/res/xml/sol_holo_data_extraction_rules.xml"
          public_assets="android/app/src/main/assets/public"

          test -s "$backup_java"
          test -s "$public_assets/sol-holo-backup.css"
          test -s "$public_assets/human-holo-test-export-core.mjs"
          test -s "$public_assets/human-holo-test-export.mjs"
          test -s "$public_assets/human-holo-local-owner-data.mjs"
          test -s "$public_assets/human-holo-test-access.js"
          test -s "$public_assets/human-holo-animal-core.mjs"
          test -s "$public_assets/human-holo-animal-holos.mjs"
          for animal_photo in salt peps tina gurke moehrchen; do
            test -s "$public_assets/assets/animals/${animal_photo}.webp"
          done
          test -s "$public_assets/human-holo-durable-memory.mjs"
          grep -q "SPDX-License-Identifier: MIT" "$public_assets/human-holo-animal-core.mjs"
          grep -q "Kinder und Tiere niemals allein oder unbeaufsichtigt" "$public_assets/human-holo-animal-core.mjs"
          grep -q 'id: "gurke"' "$public_assets/human-holo-animal-core.mjs"
          grep -q 'id: "moehrchen"' "$public_assets/human-holo-animal-core.mjs"
          grep -q "fulltime/history/append" "$public_assets/human-holo-animal-holos.mjs"
          grep -q "Foto ändern" "$public_assets/human-holo-animal-holos.mjs"
          grep -q "animal-holos/profile-photo/save" "$public_assets/human-holo-animal-holos.mjs"
          grep -q "save_animal_holo_observation" "$public_assets/index.html"
          grep -q "AES-GCM-256" "$public_assets/human-holo-test-export-core.mjs"
          grep -q "PBKDF2" "$public_assets/human-holo-test-export-core.mjs"
          grep -q "restoreAvailableInTest: false" "$public_assets/human-holo-test-export.mjs"
          grep -q "foreignOwnerDataDeleted: false" "$public_assets/human-holo-local-owner-data.mjs"
          grep -q "registerPlugin(SolBackupPlugin.class)" "$app_java"
          grep -q "Intent.ACTION_CREATE_DOCUMENT" "$backup_java"
          grep -q "Intent.ACTION_OPEN_DOCUMENT" "$backup_java"
          grep -q "sol_holo_access_security_v1_pam-sol.xml" "$backup_rules"
          grep -q "sol_holo_speaker_identity.xml" "$backup_rules"
          grep -q "sol_holo_access_security_v1_pam-sol.xml" "$extraction_rules"
          grep -q "sol_holo_speaker_identity.xml" "$extraction_rules"
          ! grep -q "READ_EXTERNAL_STORAGE\|WRITE_EXTERNAL_STORAGE" "$backup_java"

          for parked_asset in \
            app-lock-bootstrap.mjs \
            consent-ui-bootstrap.mjs \
            human-holo-chatgpt-memory-bridge.mjs \
            original-full-sync.js \
            sol-holo-backup-core.mjs \
            sol-holo-backup.mjs \
            sol-motion-profile.js; do
            rm -f "$public_assets/$parked_asset"
            ! test -e "$public_assets/$parked_asset"
          done

      - name: Direkte Samsung-Notes-Übergabe prüfen
        run: |
          set -Eeuo pipefail
          node scripts/check-samsung-notes-language.mjs
          notes_js="android/app/src/main/assets/public/sol-holo-ui.js"
          trusted_session_js="android/app/src/main/assets/public/trusted-app-session.mjs"
          app_html="android/app/src/main/assets/public/index.html"
          notes_java="android/app/src/main/java/com/solholo/app/PhoneContactsPlugin.java"
          app_manifest="android/app/src/main/AndroidManifest.xml"
          test -s "$notes_js"
          test -s "$trusted_session_js"
          test -s "$app_html"
          test -s "$notes_java"
          test -s "$app_manifest"
          grep -q 'Bitte dort noch speichern' "$notes_js"
          grep -q 'samsungNoteInsertionFromNaturalRequest' "$notes_js"
          grep -q 'samsungNoteTextFromNaturalRequest' "$notes_js"
          grep -q 'notes?|noten|notizen' "$notes_js"
          grep -q 'prepareSamsungNote' "$notes_js"
          grep -q 'prepareSamsungNote' "$notes_java"
          grep -q 'com.google.android.gms.actions.CREATE_NOTE' "$notes_java"
          grep -q 'com.google.android.gms.actions.extra.TEXT' "$notes_java"
          grep -q 'ClipData.newPlainText' "$notes_java"
          grep -q 'com.samsung.android.app.notes' "$notes_java"
          grep -q 'com.samsung.android.app.notes' "$app_manifest"
          grep -q 'create_personal_note' "$notes_js"
          grep -q 'REALTIME_NOTE_TOOL_NAMES' "$app_html"
          grep -q 'create_personal_note' server.mjs
          grep -q 'Schreib bitte Zucker in Notes' server.mjs
          grep -q 'Verlange niemals' server.mjs
          grep -q 'x-sol-holo-trusted-session' "$trusted_session_js"
          grep -q 'signTrustedSessionChallenge' \
            android/app/src/main/java/com/solholo/app/SolAccessSecurityPlugin.java

      - name: Mikrofon-Berechtigungen setzen
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          ]

          if marker not in text:
              raise SystemExit("Manifest-Tag nicht gefunden.")

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      marker + '\n    ' + permission,
                      1
                  )

          manifest.write_text(text, encoding="utf-8")
          print("Alle Mikrofon-Berechtigungen sind gesetzt.")
          PY

      - name: Android-Artefakte nur zur Buildprüfung kompilieren
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Lizenzhinweise im gebauten APK verifizieren
        run: |
          set -Eeuo pipefail
          apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$apk"
