          ! unzip -l "$apk" | grep -F "assets/sol-speaker-"
          ! unzip -l "$apk" | grep -F "assets/sol-kws-"
          ! unzip -l "$apk" | grep -F "assets/public/app-lock-bootstrap.mjs"
          ! unzip -l "$apk" | grep -F "assets/public/consent-ui-bootstrap.mjs"
