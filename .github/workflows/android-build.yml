          unzip -l "$apk" | grep -F "assets/public/human-holo-animal-holos.mjs"
          unzip -l "$apk" | grep -F "assets/public/human-holo-test-export-core.mjs"
          unzip -l "$apk" | grep -F "assets/public/human-holo-test-export.mjs"
          unzip -l "$apk" | grep -F "assets/public/human-holo-local-owner-data.mjs"
          unzip -l "$apk" | grep -F "assets/public/human-holo-test-access.js"
          unzip -l "$apk" | grep -F "assets/public/human-holo-durable-memory.mjs"
          unzip -p "$apk" assets/public/human-holo-animal-core.mjs \
            | grep -q "SPDX-License-Identifier: MIT"
          unzip -l "$apk" | grep -F "assets/public/third-party/HeadAudio-LICENSE.txt"
          unzip -l "$apk" | grep -F "assets/public/third-party/APACHE-2.0.txt"
          unzip -l "$apk" | grep -F "assets/public/mediapipe/MODIFICATION_NOTICE.txt"
          unzip -p "$apk" assets/public/mediapipe/vision_bundle.mjs \
            | grep -q "SOL HOLO MODIFICATION NOTICE"
          unzip -p "$apk" assets/public/THIRD_PARTY_LICENSES.txt \
            | grep -q "@mediapipe/tasks-vision"
          unzip -p "$apk" assets/public/THIRD_PARTY_LICENSES.txt \
            | grep -q "HeadAudio browser lip-sync components"
          unzip -p "$apk" assets/public/ANDROID_RUNTIME_LICENSES.txt \
