name: OpenAI Agents Migration Probe

on:
  push:
    branches:
      - openai-agents-migration
    paths:
      - "experiments/openai-agents/**"
      - ".github/workflows/openai-agents-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/openai-agents
    env:
      HUMAN_HOLO_AGENT_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout isolated migration branch
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify API secret exists
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY repository secret is not configured."
            exit 2
          fi

      - name: Install isolated dependencies
        run: npm install --ignore-scripts

      - name: Verify read-only bridge safety rules
        run: npm run test:read-only-bridge

      - name: Verify owner metadata fail-closed gate
        run: npm run test:owner-metadata-gate

      - name: Run managed Agents API probe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run probe

      - name: Run OpenAI hosted memory probe
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run memory-probe

      - name: Run strict Holo read-only bridge
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run read-only-bridge
