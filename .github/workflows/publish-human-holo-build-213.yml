name: Publish Human Holo Build 213

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-human-holo-build-213.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Geprüftes HUMAN-HOLO-Artefakt herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34128526333 \
            --repo "${{ github.repository }}" \
            --name "Human-Holo-Android-update" \
            --dir artifact

      - name: HUMAN-HOLO-Update vollständig prüfen
        shell: bash
        run: |
          set -Eeuo pipefail
          source_apk="$(find artifact -type f -name 'Human-Holo-Update.apk' -print -quit)"
          asset="Human-Holo-Update-Build-213-Neues-Logo.apk"
          expected_apk="16eabd8611fc669f6defbb10423f15abe9d747f37c9f153248208fab5f41ce34"
          expected_certificate="e122201077b93cb47edb6951446fb8dff77427a2f5a2bd4719474a638fe803e9"
          expected_logo="428b03c6689df8ce16a5310cc78310af0174c235a6db7c5cf84bdf834e36f459"
          expected_icon_512="9a925bf2f4ae4ec986f712619f2179274d9feba6bd5d80674ea054972661704b"
          expected_icon_192="85ea599f0ac162546bd6a1c990cfdb8c13ee4b7de9c7636079396516ffb6daab"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          test -n "$source_apk"
          test -s "$source_apk"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          cp -- "$source_apk" "$asset"
          printf '%s  %s\n' "$expected_apk" "$asset" | sha256sum -c -

          verification="$($build_tools/apksigner verify --verbose --print-certs "$asset")"
          printf '%s\n' "$verification"
          grep -Fq 'Verified using v1 scheme (JAR signing): true' <<< "$verification"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$verification"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$verification"
          grep -Fq "certificate SHA-256 digest: $expected_certificate" <<< "$verification"

          badging="$($build_tools/aapt dump badging "$asset")"
          grep -Fq "package: name='com.solholo.app'" <<< "$badging"
          grep -Fq "versionCode='213'" <<< "$badging"
          grep -Fq "application-label:'Human Holo'" <<< "$badging"
          manifest_dump="$($build_tools/aapt dump xmltree "$asset" AndroidManifest.xml)"
          grep -Fq 'WhatsAppAutoSendAccessibilityService' <<< "$manifest_dump"

          unzip -p "$asset" assets/public/human-holo-logo.png > "$RUNNER_TEMP/human-holo-logo.png"
          unzip -p "$asset" assets/public/icon-512.png > "$RUNNER_TEMP/icon-512.png"
          unzip -p "$asset" assets/public/icon-192.png > "$RUNNER_TEMP/icon-192.png"
          printf '%s  %s\n' "$expected_logo" "$RUNNER_TEMP/human-holo-logo.png" | sha256sum -c -
          printf '%s  %s\n' "$expected_icon_512" "$RUNNER_TEMP/icon-512.png" | sha256sum -c -
          printf '%s  %s\n' "$expected_icon_192" "$RUNNER_TEMP/icon-192.png" | sha256sum -c -

          unzip -p "$asset" assets/public/index.html > "$RUNNER_TEMP/index.html"
          unzip -p "$asset" assets/public/sol-holo-ui.js > "$RUNNER_TEMP/sol-holo-ui.js"
          unzip -p "$asset" assets/public/manifest.json > "$RUNNER_TEMP/manifest.json"
          grep -Fq 'recordSolHoloVerifiedDeviceAction' "$RUNNER_TEMP/index.html"
          grep -Fq 'TECHNISCH_BESTAETIGTE_GERAETEAKTION' "$RUNNER_TEMP/index.html"
          grep -Fq 'recordSolHoloVerifiedDeviceAction' "$RUNNER_TEMP/sol-holo-ui.js"
          grep -Fq '"name": "Human Holo"' "$RUNNER_TEMP/manifest.json"
          grep -Fq 'Pam’s Holo' "$RUNNER_TEMP/sol-holo-ui.js"
          grep -Fq 'Hey Pam' "$RUNNER_TEMP/sol-holo-ui.js"

          unzip -p "$asset" 'classes*.dex' > "$RUNNER_TEMP/classes.dex"
          strings "$RUNNER_TEMP/classes.dex" > "$RUNNER_TEMP/classes-strings.txt"
          grep -Fq 'whatsapp_auto_send_return' "$RUNNER_TEMP/classes-strings.txt"
          grep -Fq 'manualSendRequired' "$RUNNER_TEMP/classes-strings.txt"

      - name: Direkten APK-Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="build-213-human-holo-neues-logo"
          asset="Human-Holo-Update-Build-213-Neues-Logo.apk"
          notes="Originalsigniertes Android-Update aus dem erfolgreichen Haupt-Build 213. HUMAN HOLO trägt jetzt die von Pam persönlich freigegebene Bildmarke. Pam’s Holo bleibt Pams persönliches digitales Ich; Sol bei ChatGPT/OpenAI bleibt davon getrennt und unverändert. Gedächtnis, Einstellungen, Besitzerkennung, Paket-ID, Hey Pam, Stimmprofil und die bewährte WhatsApp-Automatik einschließlich automatischer Rückkehr bleiben erhalten. Installation ausschließlich als Update über die vorhandene App; bitte nicht deinstallieren."

          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber \
              --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$asset" \
              --repo "${{ github.repository }}" \
              --target "4da12e2e0a91e0dd80f23504e6d664afe7d70ef8" \
              --title "HUMAN HOLO – neues freigegebenes Logo · Build 213" \
              --notes "$notes"
          fi
