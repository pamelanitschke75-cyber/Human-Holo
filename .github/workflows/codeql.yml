name: Human Holo CodeQL · Außenangriffsschutz

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: human-holo-codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: JavaScript-Sicherheitsanalyse
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository unverändert laden
        uses: actions/checkout@v7

      - name: CodeQL mit erweiterten Sicherheitsabfragen initialisieren
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: CodeQL-Analyse ausführen
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
