version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: security
    labels:
      - dependencies
      - security

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:25"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: security
    labels:
      - dependencies
      - security
