<!doctype html>
<html lang="de" class="solholo-booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Human Holo</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  min-height:100%;
  background:#020106;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  overflow-x:hidden;
}

#solHoloBootScreen{
  display:none;
}

.solholo-booting #app{
  visibility:hidden;
}

.solholo-booting #solHoloBootScreen{
  position:fixed;
  z-index:99999;
  inset:0;
  display:grid;
  place-content:center;
  gap:12px;
  padding:32px;
  background:#020106;
  color:#fff;
  text-align:center;
}

#solHoloBootScreen strong{
  font-size:clamp(28px,8vw,46px);
}

#solHoloBootScreen .solHoloLockLogo{
  display:block;
  width:min(68vw,280px);
  height:auto;
  margin:0 auto 4px;
  border-radius:24%;
  filter:drop-shadow(0 0 22px rgba(107,98,255,.42));
}

#solHoloBootScreen .humanHoloMission{
  color:#fff;
  font-size:clamp(17px,4.8vw,23px);
  font-weight:800;
  letter-spacing:.02em;
}

#solHoloBootScreen span{
  color:#d7d4e8;
  font-size:16px;
}

#solHoloBootScreen .solHoloLockButton{
  min-width:min(78vw,320px);
  min-height:54px;
  margin-top:8px;
  padding:12px 20px;
  border:1px solid rgba(111,224,255,.76);
  border-radius:18px;
  background:linear-gradient(135deg,#7542d8,#157ba5);
  color:#fff;
  font-size:18px;
  font-weight:800;
}

#solHoloBootScreen .solHoloLockHint{
  max-width:420px;
  color:#aaa5bb;
  font-size:13px;
  line-height:1.45;
}

body.voice-open{
  overflow:hidden;
}

button,
textarea,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

#app{
  position:relative;
  width:100%;
  max-width:760px;
  min-height:100vh;
  margin:auto;
  overflow:hidden;

  background:
    linear-gradient(
      180deg,
      #12051f 0%,
      #08030f 44%,
      #020106 76%
    );
}

/*
==========================================================
HINTERGRUND
==========================================================
*/

#beachBackground{
  position:absolute;
  z-index:0;
  inset:0;

  background-image:
    linear-gradient(
      180deg,
      rgba(3,1,9,.08) 0%,
      rgba(3,1,9,.10) 28%,

  background-position:center center;
  background-repeat:no-repeat;

#backgroundGlow{

  z-index:1;
  inset:0;

  pointer-events:none;

==========================================================
HEADER
==========================================================
*/

  padding:

}

}

.brandLogo--voice{

  max-width:100%;

}

.brandLogo--drawer{

#subtitle{

SCHREIBEN
==========================================================

}

#imageButton,

      rgba(13,8,20,.98)

}

#liveButton{

#liveButton.listening{

#imageInput,

#messageWrap{

    14px 48px 12px 14px;

      135deg,

#messageInput{

  color:white;

#sendButton{

  bottom:9px;

  background:
    rgba(96,28,173,.46);

}

#sendButton:disabled{

}

/*
==========================================================
BILDVORSCHAU
==========================================================
*/

#imagePreviewPanel{
  display:none;

  margin:
    0 72px 10px;

  padding:10px;

  border:
    1px solid rgba(143,77,225,.52);

  border-radius:18px;

  background:
    rgba(10,6,18,.94);
}

#imagePreviewPanel.visible{

  align-items:center;
  flex-wrap:wrap;
  gap:10px;
}

#imagePreview{
  width:70px;
  height:70px;

  object-fit:cover;
  border-radius:13px;
}

#videoPreview{
  display:block;
  width:100%;
  max-height:240px;

  border-radius:14px;
  background:#000;
}

#imagePreview[hidden],
#videoPreview[hidden],
#mediaPreviewActions[hidden],
#videoUploadStatus[hidden]{
  display:none;
}

#imagePreviewText{
  flex:1;
  min-width:0;

  color:#ddd4e8;
  font-size:13px;
}

#publicMediaPrivacyControl{
  display:flex;
  width:100%;
  align-items:flex-start;
  gap:9px;

  padding:9px 10px;

  border:
    1px solid rgba(104,225,255,.46);

  border-radius:14px;

  background:
    rgba(18,37,76,.62);

  color:#e9faff;
  font-size:12px;
  line-height:1.35;
}

#publicMediaPrivacyControl[hidden],
#publicMediaPrivacyStatus[hidden]{

}

#publicMediaPrivacyToggle{
  width:20px;
  height:20px;
  flex:0 0 auto;
  margin:0;
  accent-color:#53dff2;
}

#publicMediaPrivacyStatus{

  color:#bceef8;
  font-size:12px;
  line-height:1.35;
}

#removeImageButton{
  width:36px;
  height:36px;

  flex:0 0 auto;

  border-radius:50%;

  border:
    1px solid rgba(163,89,255,.55);

  background:#1c1029;
  color:white;

}

#mediaPreviewActions{
  display:flex;
  width:100%;
  gap:8px;
}

#cancelMediaButton,
#confirmMediaButton{
  min-height:42px;
  padding:9px 12px;

  border-radius:14px;
  border:
    1px solid rgba(163,89,255,.55);

  color:white;
  cursor:pointer;
}

#cancelMediaButton{
  flex:0 0 auto;
  background:#1c1029;
}

#confirmMediaButton{
  flex:1;
  background:
    linear-gradient(
      135deg,
      #8637d8,
      #315de5
    );
}

#cancelMediaButton:disabled,
#confirmMediaButton:disabled{

  cursor:default;
}

#videoUploadStatus{
  width:100%;
  color:#ddd4e8;
  font-size:13px;
}

#videoUploadProgress{
  display:block;
  width:100%;
  height:8px;
  margin-bottom:6px;
  accent-color:#9b55ff;
}

/*
==========================================================
LIVE STATUS
==========================================================
*/

#liveStatus{
  min-height:28px;

  margin-top:11px;

  text-align:center;

  color:#bc6cff;

  font-size:16px;
}

.wave{
  color:#9851d8;
  letter-spacing:3px;
}

/*
==========================================================
CHAT
==========================================================
*/

#chatPanel{
  position:relative;
  z-index:25;

  margin:
    4px 13px 12px;

  padding:10px;

  border:
    1px solid rgba(143,70,225,.48);

  border-radius:21px;

  background:
    rgba(5,3,12,.79);

  backdrop-filter:
    blur(12px);
}

#chat{
  max-height:250px;

  overflow-y:auto;

  padding:2px;
}

.message{
  margin:9px 0;

  padding:
    12px 14px;

  border-radius:18px;

  border:
    1px solid rgba(145,74,225,.45);

  font-size:16px;
  line-height:1.46;

  white-space:pre-wrap;

  background:
    linear-gradient(
      135deg,
      rgba(29,12,51,.91),
      rgba(7,5,16,.95)
    );
}

.message strong{
  display:block;

  margin-bottom:5px;

  color:#b76cff;

  font-size:17px;
}

.user-message{
  margin-left:52px;
}

.sol-message,
.system-message{
  margin-right:52px;
}

.messageImage{
  display:block;

  width:100%;

  max-width:320px;
  max-height:320px;

  margin-top:9px;

  border-radius:14px;

  object-fit:contain;

  border:
    1px solid rgba(183,106,255,.30);
}

.messageMediaBadge{
  display:inline-block;

  margin-top:7px;
  padding:4px 9px;

  border-radius:999px;

  background:rgba(102,48,170,.42);
  color:#e2c9ff;

  font-size:12px;
}

/*
==========================================================
HOLO
==========================================================
*/

#solStage{
  position:relative;
  z-index:5;

  height:385px;

  display:flex;
  justify-content:center;
  align-items:flex-end;

  overflow:hidden;
}

#solCloneWrap{
  position:relative;

  --ofs-body-x:0px;
  --ofs-body-y:0px;
  --ofs-body-rotate:0deg;
  --ofs-body-scale-x:1;
  --ofs-body-scale-y:1;
  --ofs-torso-x:0px;
  --ofs-torso-y:0px;
  --ofs-torso-rotate:0deg;
  --ofs-torso-scale-x:1;
  --ofs-torso-scale-y:1;
  --ofs-hair-x:0px;
  --ofs-hair-y:0px;
  --ofs-hair-rotate:0deg;
  --ofs-body-opacity:0;
  --ofs-hair-opacity:0;

  display:inline-block;

  height:72%;
  max-width:61%;

  margin-bottom:28px;

  transform-origin:center bottom;
  transform:
    translate3d(
      var(--ofs-body-x),
      var(--ofs-body-y),
      0
    )
    rotate(var(--ofs-body-rotate))
    scale(
      var(--ofs-body-scale-x),
      var(--ofs-body-scale-y)
    );

  /* Einheitliche Schlussweichzeichnung ueber den fertig zusammengesetzten
     Holo-Verbund. Dadurch besitzen Gesicht, Mund, Haare und Koerper dieselbe
     Kantenschaerfe und ihre Ebenenuebergaenge fallen nicht mehr auf. */
  filter:blur(.42px);

  will-change:transform,filter;
}

#solImage{
  position:relative;
  z-index:1;

  display:block;

  height:100%;
  width:auto;

  max-width:100%;

  object-fit:contain;
  object-position:center bottom;

  user-select:none;
  pointer-events:none;

  filter:
    drop-shadow(
      0 0 7px rgba(134,91,255,.72)
    )
    drop-shadow(
      0 0 22px rgba(75,45,255,.40)
    );

  -webkit-mask-image:
    radial-gradient(
      ellipse 78% 98% at 50% 46%,
      #000 0%,
      #000 68%,
      rgba(0,0,0,.90) 78%,
      transparent 100%
    );

  mask-image:
    radial-gradient(
      ellipse 78% 98% at 50% 46%,
      #000 0%,
      #000 68%,
      rgba(0,0,0,.90) 78%,
      transparent 100%
    );
}

.originalFullSyncLayer{
  position:absolute;
  inset:0;

  display:block;

  width:100%;
  height:100%;
  max-width:100%;

  object-fit:contain;
  object-position:center bottom;

  opacity:0;
  pointer-events:none;
  user-select:none;

  transition:opacity 160ms ease-out;
  backface-visibility:hidden;
  will-change:transform,opacity;

  -webkit-mask-image:
    radial-gradient(
      ellipse 78% 98% at 50% 46%,
      #000 0%,
      #000 68%,
      rgba(0,0,0,.90) 78%,
      transparent 100%
    );
  mask-image:
    radial-gradient(
      ellipse 78% 98% at 50% 46%,
      #000 0%,
      #000 68%,
      rgba(0,0,0,.90) 78%,
      transparent 100%
    );
}

.originalFullSyncBody{
  z-index:3;
  transform-origin:50% 100%;
  transform:
    translate3d(
      var(--ofs-torso-x),
      var(--ofs-torso-y),
      0
    )
    rotate(var(--ofs-torso-rotate))
    scale(
      var(--ofs-torso-scale-x),
      var(--ofs-torso-scale-y)
    );
}

.originalFullSyncHair{
  z-index:7;
  transform-origin:50% 28%;
  transform:
    translate3d(
      var(--ofs-hair-x),
      var(--ofs-hair-y),
      0
    )
    rotate(var(--ofs-hair-rotate));
}

#solCloneWrap.original-full-sync-active.original-full-sync-geometry-ready
  .originalFullSyncBody{
  opacity:var(--ofs-body-opacity);
}

#solCloneWrap.original-full-sync-active.original-full-sync-geometry-ready
  .originalFullSyncHair{
  opacity:var(--ofs-hair-opacity);
}

#holoBase{
  position:absolute;

  bottom:24px;

  width:47%;
  height:18px;

  border-radius:50%;

  border:
    2px solid rgba(161,94,255,.95);

  box-shadow:
    0 0 7px #a56bff,
    0 0 22px rgba(127,73,255,.85),
    0 0 42px rgba(90,40,255,.40);
}

STATUS

==========================================================
LAUTSTÄRKE
==========================================================
*/

#stageVolumeCard{

.stageVolumeButton{

/*
==========================================================
LIP SYNC
==========================================================
*/

#faceCanvas,
#mouthCanvas{
  position:absolute;

  display:none;

  z-index:8;

  pointer-
